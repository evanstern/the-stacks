services:
  app:
    build:
      context: .
      # Bakes the running build's commit into the image (research R4 —
      # belongs to the image, not the container). Defaults to "unknown" for
      # a plain `docker compose up` (self-hoster path, no env.mjs).
      args:
        GIT_COMMIT: ${STACKS_COMMIT:-unknown}
    env_file: .env
    environment:
      # TEST_DATABASE_URL is a HOST-only variable: it points at the
      # loopback-published port so host-run tests and migrations can reach
      # Postgres (runbook amendment A3). `env_file` would otherwise pass it
      # into the container, where `localhost` means the container itself and
      # nothing is listening — so anything preferring it in here would break.
      # Blank it explicitly so DATABASE_URL (@db:5432) governs inside.
      TEST_DATABASE_URL: ""
    ports:
      # Default matters here, not just as a self-hoster convenience: this
      # file is also `extends`-interpolated by docker-compose.test.yml
      # (spec 020 R1), and CI runs that file with no APP_PORT set at all.
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    # Per-worktree stack identity (spec 010) — set by scripts/env.mjs;
    # a plain `docker compose up` falls back to these defaults untouched.
    labels:
      org.the-stacks.env: ${STACKS_ENV:-default}
      org.the-stacks.worktree: ${STACKS_WORKTREE:-}
      org.the-stacks.commit: ${STACKS_COMMIT:-unknown}
    healthcheck:
      # Parses the /health body — see healthcheck.js and
      # contracts/healthcheck.md. A status-code-only check would report
      # healthy with the database down (research D1).
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 5
      # Grace period so a database that is up but not yet accepting
      # connections doesn't fail the app before it can converge (D2).
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    env_file: .env
    ports:
      # Bound to 127.0.0.1 DELIBERATELY, not 0.0.0.0. The host needs to reach
      # Postgres so integration tests can run against a real database (spec 004
      # research D2); the LAN does not. An unqualified "5432:5432" would publish
      # a self-hoster's database to their whole network. Override DB_PORT if
      # 5432 is already taken on the host. See runbook amendment A3.
      # The default stays 127.0.0.1. Only scripts/env.mjs sets
      # STACKS_PUBLISH_ADDR (0.0.0.0), and only for a remote daemon
      # (DOCKER_HOST=tcp://…, spec 127): there 0.0.0.0 is the daemon's own
      # network namespace (e.g. the agent DinD sidecar), not the host LAN.
      - "${STACKS_PUBLISH_ADDR:-127.0.0.1}:${DB_PORT:-5432}:5432"
    labels:
      org.the-stacks.env: ${STACKS_ENV:-default}
      org.the-stacks.worktree: ${STACKS_WORKTREE:-}
      org.the-stacks.commit: ${STACKS_COMMIT:-unknown}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  db-data:
