project_name: "the-stacks"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
definition_of_done: ["All tests and checks run green", "All acceptance criteria are met or explicitly bypassed with notes"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "nvim"
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: true
filesystem_only: false
zero_padded_ids: 4
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
