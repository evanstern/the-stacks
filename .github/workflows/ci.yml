name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks
      TEST_DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks
      REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4

      # The pgvector image is named once, in docker-compose.yml's `db`
      # service (spec 020 R1); this file extends it rather than repeating
      # the pin, so CI and the app run the same database image.
      - run: TEST_DB_PORT=5432 docker compose -f docker-compose.test.yml up -d --wait

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @the-stacks/server db:migrate

      - run: pnpm ci:check
