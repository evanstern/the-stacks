name: Drift dev

# vm-104 only. Hourly check that `dev` is running `main` HEAD (research R7).
# Off the top of the hour so a merge landing at :16 doesn't report drift at
# :17 — the 30-minute grace in scripts/deploy-lib.mjs covers the rest.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: drift-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    runs-on: [self-hosted, vm-104]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - run: node scripts/deploy-dev.mjs drift
